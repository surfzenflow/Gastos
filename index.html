<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8f6f">
<title>Gastos – Living Costs Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#16211d;--muted:#6b7a74;--line:#e3e9e6;--accent:#0f8f6f;--accent2:#d8f1e8;--danger:#d64545;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#19211e;--text:#e8efec;--muted:#8fa19a;--line:#26312d;--accent:#2fbf98;--accent2:#173a30;--danger:#ef6b6b;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 10px}
h3{margin:0 0 12px;font-size:18px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.nav .pl{font-weight:600;text-align:center;flex:1}
.nav button{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.lbl{color:var(--muted);font-size:13px}
.big{font-size:32px;font-weight:700;margin:2px 0 8px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.over{background:var(--danger)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.chart{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:6px}
.chart .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.chart .b i{display:block;width:100%;background:var(--accent2);border-radius:3px 3px 0 0;min-height:2px}
.chart .b.td i{background:var(--accent)}
.chart .b span{font-size:10px;color:var(--muted);height:14px;line-height:14px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0 10px;background:var(--line)}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0}
.crow .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.crow .nm{flex:1;min-width:0}
.crow .nm small{display:block;color:var(--muted)}
.crow .am{font-weight:600}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:14px 4px 6px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);padding:10px 12px;border-radius:12px;margin-bottom:6px;box-shadow:var(--shadow)}
.item .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600}
.item .nm small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .am{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab button{flex:1;padding:9px 0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab button b{font-size:20px;font-weight:400}
.tab button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6;line-height:1}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.amt{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700;margin-bottom:10px}
.amt input{font-size:30px;font-weight:700;border:0;border-bottom:2px solid var(--accent);border-radius:0;background:none;padding:4px 0}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.chip{border:2px solid transparent;background:var(--bg);border-radius:12px;padding:8px 2px;font-size:11px;text-align:center;line-height:1.2}
.chip b{display:block;font-size:22px;font-weight:400}
.chip.on{border-color:var(--accent);background:var(--accent2)}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}
label input,label select{margin-top:4px;color:var(--text);font-size:16px}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--bg);text-align:center}
.btn.pri{background:var(--accent);color:#fff}
.btn.dng{color:var(--danger)}
.btn.sm{flex:none;padding:10px 14px}
.set h4{margin:18px 4px 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;grid-template-columns:70px 1fr;gap:8px}
.cat-add{display:grid;grid-template-columns:64px 1fr auto;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin:6px 2px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div id="app"><div id="main"></div></div>
<button class="fab" data-a="add" aria-label="Add expense">+</button>
<div class="tab">
  <button data-a="tab" data-t="home"><b>📒</b>Spending</button>
  <button data-a="tab" data-t="bills"><b>🔁</b>Bills</button>
  <button data-a="tab" data-t="set"><b>⚙️</b>Settings</button>
</div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
const $=s=>document.querySelector(s);
const KEY='gastos.v1';
const PALETTE=['#e8894a','#4aa3e8','#8a6fe0','#e0b13a','#35b58a','#e0607e','#5f7ad9','#46b6c9','#9bbf3b','#d9774f','#b06fd1','#7d8b95'];
const DEFAULT_CATS=[
 ['food','🍚','Food & Dining'],['groc','🛒','Groceries'],['rent','🏠','Rent & Housing'],['util','💡','Utilities'],
 ['net','📶','Load & Internet'],['trans','🚌','Transport'],['health','💊','Health'],['school','🎓','School'],
 ['shop','🛍️','Shopping'],['fun','🎬','Leisure'],['fam','👨‍👩‍👧','Family & Support'],['other','📦','Other']
].map((c,i)=>({id:c[0],emoji:c[1],name:c[2],color:PALETTE[i%PALETTE.length]}));

function fresh(){return {settings:{currency:'₱',budget:0},cats:DEFAULT_CATS.map(c=>({...c})),expenses:[],recurring:[]}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.cats)&&Array.isArray(r.expenses)){r.recurring=r.recurring||[];r.settings=Object.assign({currency:'₱',budget:0},r.settings);return r}}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – browser storage is blocked')}}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const todayStr=()=>iso(new Date());
const fmt=n=>S.settings.currency+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const catOf=id=>S.cats.find(c=>c.id===id)||{id:'?',emoji:'📦',name:'Uncategorized',color:'#7d8b95'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let V={mode:'month',date:todayStr(),tab:'home'};
let F={};

function range(){
  const a=parse(V.date);
  if(V.mode==='day')return [a,a];
  if(V.mode==='week'){const s=weekStart(a);return [s,addDays(s,6)]}
  return [new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
}
function dayLabel(ds){
  if(ds===todayStr())return 'Today';
  if(ds===iso(addDays(new Date(),-1)))return 'Yesterday';
  const d=parse(ds);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();
}
function periodLabel(){
  const [s,e]=range();
  if(V.mode==='day')return dayLabel(V.date)+(V.date===todayStr()||V.date===iso(addDays(new Date(),-1))?'':', '+s.getFullYear());
  if(V.mode==='week')return MON[s.getMonth()]+' '+s.getDate()+' – '+(s.getMonth()===e.getMonth()?'':MON[e.getMonth()]+' ')+e.getDate()+', '+e.getFullYear();
  return MONL[s.getMonth()]+' '+s.getFullYear();
}
function shift(dir){
  const a=parse(V.date);
  if(V.mode==='day')V.date=iso(addDays(a,dir));
  else if(V.mode==='week')V.date=iso(addDays(a,7*dir));
  else V.date=iso(new Date(a.getFullYear(),a.getMonth()+dir,1));
}
function entries(s,e){
  const a=iso(s),b=iso(e);
  const out=S.expenses.filter(x=>x.date>=a&&x.date<=b).map(x=>Object.assign({},x));
  for(let d=new Date(s);d<=e;d=addDays(d,1)){
    const ds=iso(d);
    for(const r of S.recurring){
      if(ds<r.start)continue;
      let hit=false;
      if(r.freq==='daily')hit=true;
      else if(r.freq==='weekly')hit=Math.round((d-parse(r.start))/864e5)%7===0;
      else hit=d.getDate()===Math.min(parse(r.start).getDate(),dim(d.getFullYear(),d.getMonth()));
      if(hit)out.push({id:'r:'+r.id+':'+ds,amt:r.amt,cat:r.cat,note:r.note,date:ds,rec:r.id});
    }
  }
  return out;
}
function budgetFor(s){
  const B=+S.settings.budget||0;if(!B)return 0;
  const n=dim(s.getFullYear(),s.getMonth());
  if(V.mode==='day')return B/n;
  if(V.mode==='week')return B*7/n;
  return B;
}

/* ---------- screens ---------- */
function home(){
  const [s,e]=range();
  const list=entries(s,e);
  const total=list.reduce((a,x)=>a+x.amt,0);
  const B=budgetFor(s);
  const now=new Date();now.setHours(0,0,0,0);
  let days=Math.round((e-s)/864e5)+1;
  if(s<=now&&now<e)days=Math.round((now-s)/864e5)+1;
  const name={day:'day',week:'week',month:'month'}[V.mode];
  let h=`<h1>Gastos</h1>
  <div class="nav"><button data-a="prev" aria-label="Previous">‹</button><button class="pl" data-a="today">${esc(periodLabel())}</button><button data-a="next" aria-label="Next">›</button></div>
  <div class="seg">${['day','week','month'].map(m=>`<button class="${V.mode===m?'on':''}" data-a="mode" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
  <div class="card"><div class="lbl">Spent this ${name}</div><div class="big">${fmt(total)}</div>`;
  if(B){
    h+=`<div class="bar"><i class="${total>B?'over':''}" style="width:${Math.min(100,total/B*100)}%"></i></div>
    <div class="sub">${total>B?fmt(total-B)+' over budget':fmt(B-total)+' left of '+fmt(B)}</div>`;
  }else h+=`<div class="sub">Set a monthly budget in Settings to see what's left.</div>`;
  if(V.mode!=='day'&&total>0)h+=`<div class="sub">Average per day: ${fmt(total/days)}</div>`;
  h+=`</div>`;

  if(V.mode!=='day'&&total>0){
    const sums={};list.forEach(x=>sums[x.date]=(sums[x.date]||0)+x.amt);
    const ds=[];for(let d=new Date(s);d<=e;d=addDays(d,1))ds.push(d);
    const mx=Math.max.apply(null,ds.map(d=>sums[iso(d)]||0))||1;
    h+=`<div class="card"><div class="lbl">Daily spending · tap a bar to open that day</div><div class="chart">`+ds.map(d=>{
      const k=iso(d),v=sums[k]||0;
      const lab=V.mode==='week'?DOW[d.getDay()][0]:((d.getDate()%5===0||d.getDate()===1)?d.getDate():'');
      return `<button class="b ${k===todayStr()?'td':''}" data-a="bar" data-d="${k}"><i style="height:${Math.round(v/mx*100)}%"></i><span>${lab}</span></button>`}).join('')+`</div></div>`;
  }

  if(total>0){
    const by={};list.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
    const rows=Object.keys(by).sort((a,b)=>by[b]-by[a]);
    h+=`<div class="card"><div class="lbl">By category</div><div class="stack">`+rows.map(id=>`<i style="width:${by[id]/total*100}%;background:${catOf(id).color}"></i>`).join('')+`</div>`+
    rows.map(id=>{const c=catOf(id);return `<div class="crow"><div class="dot" style="background:${c.color}33">${esc(c.emoji)}</div><div class="nm">${esc(c.name)}<small>${Math.round(by[id]/total*100)}%</small></div><div class="am">${fmt(by[id])}</div></div>`}).join('')+`</div>`;
  }

  if(!list.length){
    h+=`<div class="empty">No expenses for this ${name} yet.<br>Tap <b>+</b> to add one.</div>`;
  }else{
    list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
    const groups={};list.forEach(x=>(groups[x.date]=groups[x.date]||[]).push(x));
    Object.keys(groups).sort().reverse().forEach(d=>{
      const t=groups[d].reduce((a,x)=>a+x.amt,0);
      h+=`<div class="dayh"><span>${esc(dayLabel(d))}</span><span>${fmt(t)}</span></div>`;
      groups[d].forEach(x=>{
        const c=catOf(x.cat);
        h+=`<button class="item" data-a="${x.rec?'recinfo':'edit'}" data-id="${esc(x.id)}"><div class="dot" style="background:${c.color}33">${esc(c.emoji)}</div><div class="nm"><b>${esc(x.note||c.name)}</b><small>${esc(c.name)}${x.rec?' · recurring':''}</small></div><div class="am">${fmt(x.amt)}</div></button>`;
      });
    });
  }
  return h;
}

const FREQ={daily:'Every day',weekly:'Every week',monthly:'Every month'};
function monthlyEq(r){return r.freq==='daily'?r.amt*30:r.freq==='weekly'?r.amt*52/12:r.amt}
function bills(){
  const tot=S.recurring.reduce((a,r)=>a+monthlyEq(r),0);
  let h=`<h1>Fixed bills</h1><div class="card"><div class="lbl">Recurring costs, about per month</div><div class="big">${fmt(tot)}</div>
  <div class="sub">Rent, subscriptions, loads, allowance — add them once and they count automatically on the right dates.</div></div>
  <button class="btn pri" style="width:100%;margin-bottom:12px" data-a="addbill">+ Add recurring bill</button>`;
  if(!S.recurring.length)h+=`<div class="empty">No recurring bills yet.</div>`;
  S.recurring.forEach(r=>{const c=catOf(r.cat);
    h+=`<button class="item" data-a="editbill" data-id="${esc(r.id)}"><div class="dot" style="background:${c.color}33">${esc(c.emoji)}</div><div class="nm"><b>${esc(r.note||c.name)}</b><small>${FREQ[r.freq]} · from ${esc(dayLabel(r.start))}</small></div><div class="am">${fmt(r.amt)}</div></button>`});
  return h;
}
function settings(){
  const st=S.settings;
  let h=`<div class="set"><h1>Settings</h1>
  <div class="card"><div class="two"><label>Currency<input id="s-cur" maxlength="4" value="${esc(st.currency)}"></label>
  <label>Monthly budget<input id="s-bud" inputmode="decimal" placeholder="0 = no budget" value="${st.budget||''}"></label></div>
  <div class="note">Daily and weekly budgets are worked out from your monthly budget.</div></div>
  <h4>Categories</h4><div class="card">`;
  S.cats.forEach(c=>{h+=`<div class="crow"><div class="dot" style="background:${c.color}33">${esc(c.emoji)}</div><div class="nm">${esc(c.name)}</div><button class="btn sm dng" data-a="delcat" data-id="${esc(c.id)}">Remove</button></div>`});
  h+=`<div class="cat-add"><input id="c-emo" maxlength="4" placeholder="🙂"><input id="c-name" placeholder="New category name"><button class="btn pri sm" data-a="addcat">Add</button></div></div>
  <h4>Your data</h4><div class="card">
  <div class="note" style="margin-top:0">Everything is stored only on this device. Back up now and then, especially before clearing browser data.</div>
  <div class="row"><button class="btn" data-a="export">Backup (.json)</button><button class="btn" data-a="import">Restore</button></div>
  <div class="row"><button class="btn" data-a="csv">Export CSV</button><button class="btn dng" data-a="reset">Erase all</button></div></div></div>`;
  return h;
}
function render(){
  document.querySelectorAll('.tab button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));
  $('.fab').style.display=V.tab==='set'?'none':'block';
  $('#main').innerHTML=V.tab==='home'?home():V.tab==='bills'?bills():settings();
}

/* ---------- sheets / forms ---------- */
function sheet(html){const o=$('#sheet');o.innerHTML='<div class="bk" data-a="close"></div><div class="pn">'+html+'</div>';o.classList.add('open')}
function closeSheet(){const o=$('#sheet');o.classList.remove('open');o.innerHTML=''}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function chips(){return S.cats.map(c=>`<button class="chip ${F.cat===c.id?'on':''}" data-a="pick" data-id="${esc(c.id)}"><b>${esc(c.emoji)}</b>${esc(c.name)}</button>`).join('')}
function num(v){const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:NaN}

function expForm(id){
  const x=id?S.expenses.find(e=>e.id===id):null;
  F={cat:x?x.cat:(S.cats[0]||{}).id};
  const d=x?x.date:(V.mode==='day'?V.date:todayStr());
  sheet(`<h3>${x?'Edit expense':'Add expense'}</h3>
  <div class="amt"><span>${esc(S.settings.currency)}</span><input id="f-amt" inputmode="decimal" placeholder="0.00" value="${x?x.amt:''}"></div>
  <div class="chips" id="f-cats">${chips()}</div>
  <label>Date<input type="date" id="f-date" value="${d}"></label>
  <label>Note (optional)<input id="f-note" maxlength="80" placeholder="e.g. lunch, jeep fare" value="${x?esc(x.note):''}"></label>
  <div class="row">${x?`<button class="btn dng" data-a="delexp" data-id="${esc(id)}">Delete</button>`:''}<button class="btn pri" data-a="saveexp" data-id="${esc(id||'')}">Save</button></div>`);
  if(!x)setTimeout(()=>{const i=$('#f-amt');i&&i.focus()},60);
}
function billForm(id){
  const r=id?S.recurring.find(e=>e.id===id):null;
  F={cat:r?r.cat:(S.cats.find(c=>c.id==='rent')||S.cats[0]||{}).id};
  sheet(`<h3>${r?'Edit bill':'New recurring bill'}</h3>
  <div class="amt"><span>${esc(S.settings.currency)}</span><input id="f-amt" inputmode="decimal" placeholder="0.00" value="${r?r.amt:''}"></div>
  <label>Name<input id="f-note" maxlength="80" placeholder="e.g. Rent, Netflix, Allowance" value="${r?esc(r.note):''}"></label>
  <div class="chips" id="f-cats">${chips()}</div>
  <label>Repeats<select id="f-freq">${Object.keys(FREQ).map(k=>`<option value="${k}" ${r&&r.freq===k||!r&&k==='monthly'?'selected':''}>${FREQ[k]}</option>`).join('')}</select></label>
  <label>Starting on<input type="date" id="f-date" value="${r?r.start:todayStr()}"></label>
  <div class="row">${r?`<button class="btn dng" data-a="delbill" data-id="${esc(id)}">Delete</button>`:''}<button class="btn pri" data-a="savebill" data-id="${esc(id||'')}">Save</button></div>`);
}

/* ---------- actions ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const A={
  tab(d){V.tab=d.t;render();window.scrollTo(0,0)},
  mode(d){V.mode=d.m;render()},
  prev(){shift(-1);render()},
  next(){shift(1);render()},
  today(){V.date=todayStr();render()},
  bar(d){V.date=d.d;V.mode='day';render();window.scrollTo(0,0)},
  add(){V.tab==='bills'?billForm():expForm()},
  edit(d){expForm(d.id)},
  recinfo(d){const id=d.id.split(':')[1];V.tab='bills';render();billForm(id)},
  addbill(){billForm()},
  editbill(d){billForm(d.id)},
  close(){closeSheet()},
  pick(d){F.cat=d.id;$('#f-cats').innerHTML=chips()},
  saveexp(d){
    const amt=num($('#f-amt').value);if(!(amt>0)){toast('Enter an amount');return}
    const date=$('#f-date').value||todayStr();const note=$('#f-note').value.trim();
    if(d.id){const x=S.expenses.find(e=>e.id===d.id);Object.assign(x,{amt,cat:F.cat,date,note})}
    else S.expenses.push({id:uid(),amt,cat:F.cat,date,note});
    save();closeSheet();V.date=date;render();toast('Saved');
  },
  delexp(d){S.expenses=S.expenses.filter(e=>e.id!==d.id);save();closeSheet();render();toast('Deleted')},
  savebill(d){
    const amt=num($('#f-amt').value);if(!(amt>0)){toast('Enter an amount');return}
    const o={amt,cat:F.cat,note:$('#f-note').value.trim(),freq:$('#f-freq').value,start:$('#f-date').value||todayStr()};
    if(d.id)Object.assign(S.recurring.find(r=>r.id===d.id),o);else S.recurring.push(Object.assign({id:uid()},o));
    save();closeSheet();render();toast('Saved');
  },
  delbill(d){S.recurring=S.recurring.filter(r=>r.id!==d.id);save();closeSheet();render();toast('Deleted')},
  addcat(){
    const n=$('#c-name').value.trim();if(!n){toast('Type a category name');return}
    const e=$('#c-emo').value.trim()||'🏷️';
    S.cats.push({id:'c'+uid(),emoji:e,name:n,color:PALETTE[S.cats.length%PALETTE.length]});save();render();
  },
  delcat(d){
    const used=S.expenses.some(x=>x.cat===d.id)||S.recurring.some(x=>x.cat===d.id);
    if(used&&!confirm('This category has entries. They will show as "Uncategorized". Remove anyway?'))return;
    S.cats=S.cats.filter(c=>c.id!==d.id);save();render();
  },
  export(){dl('gastos-backup-'+todayStr()+'.json',JSON.stringify(S,null,2),'application/json');toast('Backup downloaded')},
  csv(){
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const rows=[['Date','Category','Amount','Note']].concat(S.expenses.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>[x.date,catOf(x.cat).name,x.amt,x.note]));
    dl('gastos-expenses.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
  },
  import(){$('#imp').click()},
  reset(){if(confirm('Erase ALL expenses, bills and settings on this device? This cannot be undone.')){S=fresh();save();render();toast('All data erased')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t.dataset)});
document.addEventListener('change',e=>{
  if(e.target.id==='s-cur'){S.settings.currency=e.target.value.trim()||'₱';save()}
  if(e.target.id==='s-bud'){const n=num(e.target.value);S.settings.budget=n>0?n:0;save();if(!(n>0))e.target.value=''}
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.expenses)||!Array.isArray(d.cats))throw 0;
    if(!confirm('Replace everything on this device with the backup?'))return;
    d.recurring=d.recurring||[];d.settings=Object.assign({currency:'₱',budget:0},d.settings);
    S=d;save();render();toast('Backup restored')}catch(x){toast('That file is not a Gastos backup')}};
  r.readAsText(f);e.target.value='';
});
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
